:root {
  --paper:#f6f5ef;
  --white:#fff;
  --ink:#18372d;
  --muted:#5c6961;
  --line:#dfe3da;
  --accent:#deedaa;
  --soft:#edf1e8;
  --radius:18px;
  color-scheme:light;
  font-family:Assistant,Arial,sans-serif;
  color:var(--ink);
  background:var(--paper);
  font-synthesis:none;
}
* {
  box-sizing:border-box;
}
body {
  margin:0;
}
button,input,select {
  font:inherit;
}
button,a,input,select {
  -webkit-tap-highlight-color:transparent;
}
button,a {
  touch-action:manipulation;
}
button {
  cursor:pointer;
}
button:disabled {
  cursor:default;
}
a {
  color:inherit;
  text-underline-offset:4px;
}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible {
  outline:3px solid #5b7f37;
  outline-offset:4px;
}
button {
  color:inherit;
}
button,input,select {
  min-height:44px;
}
button {
  border:0;
}
a {
  text-decoration:none;
}
a:hover {
  text-decoration:underline;
}
.wrap {
  width:min(1240px,calc(100% - 80px));
  margin-inline:auto;
}
.site-header {
  min-height:108px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  gap:20px;
}
.wordmark {
  display:flex;
  align-items:center;
  gap:12px;
  font-size:19px;
  font-weight:800;
  letter-spacing:.5px;
}
.wordmark:hover {
  text-decoration:none;
}
.brand-mark {
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  background:var(--ink);
  border-radius:12px;
  color:var(--accent);
  font-size:25px;
  font-weight:500;
  letter-spacing:-2px;
  direction:ltr;
}
.brand-sub {
  display:block;
  font-size:9px;
  font-weight:500;
  letter-spacing:1.4px;
  color:var(--muted);
  margin-top:1px;
}
.site-header nav {
  display:flex;
  align-items:center;
  gap:28px;
  font-size:14px;
}
.language-button {
  background:transparent;
  border:1px solid var(--line);
  padding:0 14px;
  border-radius:30px;
  direction:ltr;
  font-size:13px;
  font-weight:600;
}
.language-button span {
  margin-left:8px;
  color:var(--muted);
}
.hero {
  display:flex;
  justify-content:space-between;
  gap:60px;
  align-items:flex-end;
  padding-block:62px 52px;
}
.eyebrow {
  font-size:13px;
  font-weight:600;
  margin:0 0 22px;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
}
.status-dot {
  height:7px;
  width:7px;
  border-radius:100%;
  background:#719653;
}
h1 {
  font-size:clamp(42px,5vw,66px);
  font-weight:700;
  line-height:1.12;
  letter-spacing:-2px;
  margin:0;
}
.hero-accent {
  color:#708767;
}
.hero-description {
  font-size:18px;
  line-height:1.75;
  max-width:600px;
  margin:24px 0 0;
  color:var(--muted);
}
.hero-note {
  border-inline-start:1px solid #ced7c8;
  padding-inline-start:28px;
  min-width:200px;
  margin-bottom:4px;
}
.note-number {
  font-size:64px;
  line-height:1;
  font-weight:400;
  letter-spacing:-3px;
}
.hero-note p {
  font-size:15px;
  margin:12px 0 2px;
}
.hero-note>span:not(.note-number) {
  display:block;
  color:var(--muted);
  font-size:13px;
}
.hero-note a {
  font-size:13px;
  display:inline-block;
  margin-top:18px;
}
.catalog {
  scroll-margin-top:24px;
}
.search-row {
  display:flex;
  gap:16px;
  align-items:stretch;
}
.search-box {
  border:1px solid #cdd6c8;
  border-radius:12px;
  background:var(--white);
  display:flex;
  align-items:center;
  gap:16px;
  flex:1;
  min-width:0;
  padding:7px 20px;
}
.search-box:focus-within {
  border-color:var(--ink);
  box-shadow:0 0 0 2px #18372d15;
}
.search-box svg {
  width:23px;
  height:23px;
  stroke:var(--ink);
  stroke-width:1.6;
  flex-shrink:0;
}
.search-box input {
  width:100%;
  min-width:0;
  border:0;
  background:transparent;
  outline:0;
  font-size:17px;
  color:var(--ink);
  min-height:46px;
}
.search-box input::-webkit-search-cancel-button {
  display:none;
}
.search-box input::placeholder {
  color:#7b847b;
}
.clear-search {
  width:40px;
  min-height:40px;
  border-radius:50%;
  background:var(--soft);
  font-size:22px;
  flex-shrink:0;
}
.status-control {
  border:1px solid #cdd6c8;
  border-radius:12px;
  padding:7px 14px;
  background:var(--white);
  min-width:210px;
}
.status-control label {
  display:block;
  font-size:11px;
  color:var(--muted);
}
select {
  color:var(--ink);
  background:transparent;
  border:0;
  max-width:100%;
  padding-inline-end:22px;
  cursor:pointer;
}
.status-control select {
  min-height:30px;
  width:100%;
  font-size:14px;
}
.task-filter {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  padding-block:22px;
  border-bottom:1px solid var(--line);
}
.task-chip {
  border:1px solid transparent;
  background:transparent;
  border-radius:30px;
  padding:7px 16px;
  font-size:14px;
  white-space:nowrap;
}
.task-chip:hover {
  background:var(--soft);
}
.task-chip[aria-pressed=true] {
  background:var(--ink);
  color:var(--white);
}
.results-toolbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding-block:20px;
}
.results-toolbar p {
  font-size:14px;
  margin:0;
  color:var(--muted);
}
.results-toolbar strong {
  color:var(--ink);
  font-weight:600;
}
.results-actions {
  display:flex;
  align-items:center;
  gap:12px;
}
.results-actions select {
  font-size:13px;
}
.results-actions button {
  background:transparent;
  font-size:13px;
  text-decoration:underline;
  padding:0;
}
.empty-state {
  text-align:center;
  padding:70px 20px;
  border:1px dashed #c9d4c2;
  border-radius:18px;
  background:#eff2e8;
}
.empty-state>span {
  font-size:46px;
}
.empty-state h3 {
  font-size:24px;
  margin:14px 0 4px;
}
.empty-state p {
  color:var(--muted);
}
.primary-button {
  background:var(--ink);
  color:white;
  border-radius:10px;
  padding:12px 22px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-size:15px;
  font-weight:500;
}
.primary-button:hover {
  background:#2e5140;
  text-decoration:none;
}
.method {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:70px;
  border-top:1px solid var(--line);
  margin-top:70px;
  padding-block:46px 52px;
}
.method h2 {
  font-size:35px;
  font-weight:600;
  letter-spacing:-1px;
  margin:0;
}
.method .eyebrow {
  margin-bottom:15px;
}
.method-copy p {
  font-size:15px;
  color:var(--muted);
  line-height:1.8;
  margin:0 0 15px;
}
.text-button {
  background:transparent;
  font-size:14px;
  padding:0;
  text-align:start;
  text-decoration:underline;
  text-underline-offset:5px;
}
.site-footer {
  border-top:1px solid var(--line);
  padding-block:28px 38px;
  display:flex;
  justify-content:space-between;
  gap:24px;
  font-size:12px;
}
.site-footer>span {
  font-weight:700;
  letter-spacing:1px;
}
.footer-by {
  font-weight:400;
  letter-spacing:0;
  color:var(--muted);
}
.site-footer>div {
  display:flex;
  gap:22px;
  flex-wrap:wrap;
  color:var(--muted);
}
dialog {
  border:1px solid var(--line);
  border-radius:22px;
  width:min(720px,calc(100% - 32px));
  max-height:calc(100dvh - 48px);
  padding:0;
  color:var(--ink);
  background:var(--paper);
  overscroll-behavior:contain;
}
dialog::backdrop {
  background:#12271fc0;
  backdrop-filter:blur(4px);
}
body:has(dialog[open]) {
  overflow:hidden;
}
.dialog-shell {
  padding:40px;
  position:relative;
}
.dialog-close {
  position:sticky;
  top:0;
  margin-inline-start:auto;
  display:block;
  width:42px;
  min-height:42px;
  border:1px solid var(--line);
  border-radius:50%;
  background:var(--white);
  font-size:25px;
  z-index:1;
}
.detail-eyebrow {
  display:flex;
  gap:10px;
  align-items:center;
  margin:8px 0 20px;
}
.detail-header h2 {
  font-size:38px;
  letter-spacing:-1px;
  line-height:1.15;
  margin:0 0 12px;
  overflow-wrap:anywhere;
}
.detail-header .provider {
  font-size:14px;
  color:var(--muted);
  margin:0;
}
.detail-description {
  font-size:18px;
  line-height:1.8;
  margin:24px 0;
}
.detail-actions {
  display:flex;
  gap:14px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:28px;
}
.detail-date {
  font-size:12px;
  color:var(--muted);
}
.detail-section {
  padding-block:22px;
  border-top:1px solid var(--line);
}
.detail-section h3 {
  font-size:16px;
  font-weight:600;
  margin:0 0 12px;
}
.detail-section ul {
  padding-inline-start:20px;
  margin:0;
}
.detail-section li {
  font-size:14px;
  line-height:1.85;
  margin-bottom:8px;
  overflow-wrap:anywhere;
}
.detail-section p {
  font-size:14px;
  line-height:1.85;
  color:var(--muted);
  margin:0 0 12px;
}
.detail-section summary {
  cursor:pointer;
  font-size:16px;
  font-weight:600;
  min-height:32px;
}
.detail-section[open] summary {
  margin-bottom:16px;
}
.source-list a {
  display:block;
  text-decoration:underline;
  overflow-wrap:anywhere;
}
.source-list time {
  font-size:12px;
  color:var(--muted);
}
.historical-scores {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.historical-scores span {
  background:var(--soft);
  font-size:12px;
  padding:5px 8px;
  border-radius:5px;
  direction:ltr;
}
.skip-link {
  position:fixed;
  top:-100px;
  inset-inline-start:16px;
  background:var(--ink);
  color:white;
  z-index:99;
  padding:12px;
}
.skip-link:focus {
  top:12px;
}
.sr-only {
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}
[hidden] {
  display:none!important;
}

/* Compact, selectable typographic atlas. Color identifies categories, never verification. */
:root {--paper:#faf9f6;--ink:#303b3a;--muted:#65706e;--line:#e1e4df;}
.site-header {min-height:72px;}
.brand-mark {background:#e7ebe3;color:#4c655b;border-radius:50%;}
.hero {padding-block:24px 18px;gap:24px;align-items:center;}
.hero .eyebrow {margin-bottom:8px;font-size:12px;}
h1 {font-size:38px;letter-spacing:-.8px;font-weight:600;}
.hero-description {font-size:16px;margin-top:8px;line-height:1.4;}
.hero-note {min-width:170px;padding-inline-start:20px;}
.note-number {font-size:28px;letter-spacing:0;}
.hero-note p {display:inline;font-size:13px;margin-inline-start:6px;}
.hero-note a {margin-top:4px;}
.search-box {padding:0 14px;border-radius:8px;}
.status-control {padding:3px 12px;border-radius:8px;}
.task-filter {padding-block:8px;gap:2px;}
.task-chip {padding:4px 12px;min-height:40px;}
.results-toolbar {padding-block:4px;}
.map-legend {font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.5;}
.tool-grid {display:block;columns:3;column-gap:28px;}
.map-group {--tone:#536d64;break-inside:avoid;margin:0 0 22px;border-top:2px solid color-mix(in srgb,var(--tone) 40%,transparent);}
.map-group[data-category=video] {--tone:#876756;}
.map-group[data-category=audio] {--tone:#756387;}
.map-group[data-category=design] {--tone:#577685;}
.map-group[data-category=workflow] {--tone:#766d46;}
.map-group[data-category=text] {--tone:#596c94;}
.map-group[data-category=spatial] {--tone:#8a6574;}
.group-heading {margin:0 0 3px;font-size:15px;font-weight:600;}
.group-heading button {display:flex;align-items:center;gap:10px;background:transparent;color:var(--tone);padding:0;min-height:40px;}
.group-count {font-size:12px;font-weight:400;color:var(--muted);}
.label-cloud {display:flex;flex-wrap:wrap;align-items:baseline;gap:0 12px;}
.tool-card {display:contents;}
.tool-label {display:inline-flex;max-width:100%;align-items:baseline;gap:3px;min-height:44px;padding:3px 0;background:transparent;color:var(--tone);text-align:start;border-radius:3px;user-select:text;}
.tool-label:hover {color:var(--ink);background:color-mix(in srgb,var(--tone) 8%,transparent);}
.tool-label h3 {font-size:var(--score-size);font-weight:500;line-height:1.15;letter-spacing:-.55px;margin:0;overflow-wrap:anywhere;}
.verification-mark,.unrated-mark {font-size:11px;align-self:flex-start;margin-top:4px;color:var(--muted);}
.method {margin-top:28px;}
.badge {font-size:12px;}
@media(max-width:1000px) {.tool-grid {columns:2;} .wrap {width:calc(100% - 40px);}}
@media(max-width:620px) {
 .wrap {width:calc(100% - 28px);}
 .site-header {min-height:60px;}
 .brand-sub {font-size:8px;}
 .hero {padding-block:16px 12px;display:block;}
 h1 {font-size:29px;letter-spacing:-.4px;}
 .hero .eyebrow,.hero-note,.hero-description {display:none;}
 .search-row {gap:6px;}
 .status-control,.mobile-task-control {padding:3px 8px;border-radius:6px;}
 .status-control select,.mobile-task-control select {min-height:44px;}
 .results-toolbar {padding-block:0;}
 .map-legend {font-size:12px;margin:0 0 12px;}
 .tool-grid {columns:1;}
 .map-group {margin-bottom:16px;}
 .label-cloud {gap:0 12px;}
 .tool-label h3 {font-size:max(16px,calc(var(--score-size) * .8));letter-spacing:-.3px;}
 .tool-label {padding:4px 0;}
 .group-heading button {min-height:44px;}
}

/* One shared field preserves the cloud's simultaneous multi-domain overview. */
.hero {display:none;}
.site-header {min-height:64px;border-bottom:0;}
.catalog {padding-top:4px;}
.search-row {gap:8px;}
.search-box {max-width:620px;}
.task-filter {gap:2px;border:0;padding-block:5px;}
.task-chip {min-height:36px;border-radius:5px;padding:3px 10px;font-size:14px;}
