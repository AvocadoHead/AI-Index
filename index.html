<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A thoughtful directory of creative AI tools, with dated official sources and clear verification status.">
  <title>AI Index — כלים לעבודה יצירתית</title>
  <link rel="stylesheet" href="styles.css">
  <script src="modules.js" defer></script>
  <script src="catalog-data.js" defer></script>
  <script src="catalog-audit.js" defer></script>
  <script src="official-summaries.js" defer></script>
  <script src="creative-guide.js" defer></script>
  <script src="curation.js" defer></script>
  <script src="sphere.js" defer></script>
  <script src="layout-transition.js" defer></script>
  <script src="directory.js" defer></script>
</head>
<body>
  <a href="#catalog" class="skip-link" data-i18n="skip">דילוג לכלים</a>
  <header class="site-header wrap">
    <a class="wordmark" href="#" aria-label="AI Index"><span class="brand-mark" aria-hidden="true">ai</span><span dir="ltr">AI INDEX<span class="brand-sub">A CREATIVE FIELD GUIDE</span></span></a>
    <nav aria-label="ניווט ראשי" id="mainNav">
      <button id="workflowOpen" class="workflow-open" type="button">תהליך וידאו <span aria-hidden="true">↗</span></button>
      <button id="languageToggle" class="language-button" type="button" aria-label="Switch to English">EN <span aria-hidden="true">↔</span></button>
    </nav>
  </header>
  <main>
    <div hidden><span id="recordCount"></span><span id="checkedSummary"></span></div>
    <section id="catalog" class="catalog wrap" aria-labelledby="catalogHeading">
      <div class="catalog-title"><h1 id="catalogHeading" data-i18n="directory">כלים ליצירה</h1><span class="catalog-caption" data-i18n="catalogCaption">מגלים, משווים, יוצרים</span></div>
      <div class="search-row">
        <div class="search-box">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
          <label for="searchInput" class="sr-only" data-i18n="searchLabel">חיפוש כלים</label>
          <input id="searchInput" type="search" autocomplete="off" placeholder="שם כלי, ספק או תיאור…">
          <button id="clearSearch" type="button" class="clear-search" aria-label="ניקוי החיפוש" hidden>×</button>
        </div>
        <button id="categoryOpen" class="category-open" type="button" aria-haspopup="dialog" aria-controls="categoryDialog" aria-expanded="false"><span aria-hidden="true">☰</span> <span data-i18n="categoriesMenu">קטגוריות</span><span id="categoryCount" hidden></span></button>
      </div>
      <div class="overview-bar"><p id="resultsCount" role="status" aria-live="polite"></p><div class="layout-toolbar" role="group" aria-label="Layout"><button id="sphereLayout" type="button" aria-pressed="false"><span data-i18n="sphereLayout">ספירה</span></button><button id="atlasLayout" type="button" aria-pressed="true"><span data-i18n="atlasLayout">אטלס</span></button></div><button id="resetFilters" type="button" hidden data-i18n="reset">איפוס סינון</button></div>
      <div id="motionControls" hidden><button id="rotateLeft" type="button">←</button><button id="motionToggle" type="button" aria-pressed="false">▶</button><button id="rotateRight" type="button">→</button><button id="resetSphere" type="button" data-i18n="resetSphere">מרכוז</button></div>
      <p id="sphereHint" class="sr-only" data-i18n="sphereHint"></p><p id="sphereFallback" role="status" hidden></p>
      <div id="sphereStage" class="sphere-stage atlas-mode" tabindex="-1" aria-label="Interactive tool sphere" aria-describedby="sphereHint"><canvas id="sphereCanvas" aria-hidden="true" hidden></canvas><div id="toolGrid" class="tool-grid"></div></div>
      <div id="emptyState" class="empty-state" hidden><span aria-hidden="true">⌕</span><h3 data-i18n="emptyTitle">לא מצאנו התאמה הפעם.</h3><p data-i18n="emptyDescription">נסו מילה אחרת או הרחיבו את הסינון.</p><button id="emptyReset" type="button" class="primary-button" data-i18n="showAll">הצגת כל הכלים</button></div>
      <noscript><p>יש להפעיל JavaScript כדי לחפש באינדקס. Enable JavaScript to browse the directory.</p><a href="data/catalog.json">Catalog data</a></noscript>
    </section>
    <details id="method" class="method-note wrap"><summary data-i18n="about">על האינדקס</summary><p data-i18n="methodCopy"></p><p data-i18n="scoresCopy"></p></details>
  </main>
  <footer class="site-footer wrap"><span dir="ltr">AI INDEX </span><div><a href="legacy.html" data-i18n="legacy">תצוגה מקורית ועריכה מקומית</a><a href="data/catalog.json" data-i18n="data">נתוני האינדקס</a><a href="https://buymeacoffee.com/Optopia" target="_blank" rel="noopener noreferrer" data-i18n="support">תמיכה בפרויקט ↗</a></div></footer>
  <dialog id="categoryDialog" class="category-drawer" aria-labelledby="categoryTitle"><div class="category-sheet"><header><h2 id="categoryTitle" data-i18n="categoriesMenu">קטגוריות</h2><button id="categoryClose" class="category-close" type="button" aria-label="Close categories">×</button></header><div class="task-filter" id="taskFilters" role="group" aria-label="סינון לפי משימה"></div><details class="refine-options"><summary data-i18n="refine">אפשרויות נוספות</summary>
        <div class="status-control"><label for="statusFilter" data-i18n="verification">מצב בדיקה</label><select id="statusFilter"><option value="all">כל הרשומות</option><option value="checked">נבדקו במקור רשמי</option><option value="pending">ממתינות לבדיקה</option><option value="retired">כלים שהופסקו</option></select></div>
<div class="drawer-field"><label for="scopeFilter" data-i18n="scopeLabel">אוסף</label><select id="scopeFilter"><option value="curated">נקודת פתיחה</option><option value="current">כל הנוכחיים</option><option value="all">הכול והארכיון</option><option value="archived">ארכיון</option></select></div><div class="drawer-field"><label for="sortOrder" data-i18n="sort">סדר התוצאות</label><select id="sortOrder"><option value="reviewed">נבדקו תחילה</option><option value="name">לפי שם</option></select></div></details><button id="categoryDone" class="category-done" type="button" data-i18n="showTools">הצגת הכלים</button><div hidden><select id="mobileTask"></select></div></div></dialog>
  <dialog id="detailDialog" aria-labelledby="detailTitle"><div class="dialog-shell"><button class="dialog-close" id="closeDialog" type="button" aria-label="סגירת פרטים">×</button><div id="detailContent"></div></div></dialog>
</body>
</html>
